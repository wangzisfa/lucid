name: Android APK

# Builds an installable Android APK in the cloud (the sandbox can't reach
# Google's Android repos). Produces a release-type APK signed with the
# committed release keystore, so it bundles the JS and runs standalone (no Metro
# needed) and is installable / upgrade-installable on any device. Built with the
# old architecture (-PnewArchEnabled=false) so no NDK is required.
#
# On each push to the dev branch it publishes TWO releases via the GitHub API
# (the workflow token creates the tags server-side — no git tag push needed):
#   - a proper versioned, non-prerelease release  `v<versionName>`
#   - a rolling `android-build` prerelease (always points at latest WIP)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/amazing-davinci-4f1Hy
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Read app version
        id: ver
        run: |
          V=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App versionName = $V"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build release APK (old arch, no NDK)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PnewArchEnabled=false --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/lucid-terminal.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucid-terminal-apk
          path: dist/lucid-terminal.apk
          if-no-files-found: error

      # Proper versioned release (non-prerelease). The action creates the tag
      # `v<version>` at this commit through the API, so no git tag push is needed.
      - name: Publish versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Lucid Terminal v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Release-signed Android APK — **v${{ steps.ver.outputs.version }}**.

            - release build (JS bundled, runs without a Metro dev server)
            - signed with the project's release keystore (self-signed demo key,
              not a Play Store key) — installable after enabling "install unknown
              apps" on your device
            - old architecture (no NDK)

            Download `lucid-terminal.apk` below. By default the app talks to a
            local agent server (`10.0.2.2:3000` on an emulator); set
            **Settings → providers → server url** to a reachable server to use it
            on a real device.
          prerelease: false
          files: dist/lucid-terminal.apk

      # Rolling latest-WIP prerelease.
      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build
          name: Lucid Terminal — Android (latest WIP)
          body: |
            Rolling pre-release APK built from the dev branch. For a stable build
            see the latest versioned release (v${{ steps.ver.outputs.version }}).
          prerelease: true
          files: dist/lucid-terminal.apk
