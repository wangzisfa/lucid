name: Android APK

# Builds an installable Android APK in the cloud (the sandbox can't reach
# Google's Android repos). Produces a release-type APK signed with the debug
# keystore, so it bundles the JS and runs standalone (no Metro needed), and is
# installable on any device. Built with the old architecture
# (-PnewArchEnabled=false) so no NDK is required — faster and more reliable.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/amazing-davinci-4f1Hy
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build release APK (old arch, no NDK)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PnewArchEnabled=false --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/lucid-terminal-debug.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucid-terminal-apk
          path: dist/lucid-terminal-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build
          name: Lucid Terminal — Android (debug-signed)
          body: |
            Installable Android APK built by CI from `claude/amazing-davinci-4f1Hy`.

            - release build (JS bundled, runs without a Metro dev server)
            - signed with the debug keystore — installable after enabling
              "install unknown apps" on your device
            - old architecture (no NDK)

            Download `lucid-terminal-debug.apk` below. By default the app talks to
            a local agent server (`10.0.2.2:3000` on an emulator); set
            **Settings → providers → server url** to a reachable server to use it
            on a real device.
          prerelease: true
          files: dist/lucid-terminal-debug.apk
