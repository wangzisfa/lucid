<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF8AB4" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FF8AB4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF8AB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#08070f"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>
  </defs>

  <!-- Maskable safe-zone = inner 80%. All content sits comfortably inside. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Faint grid (sparse so the icon reads clean at small sizes) -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 128 H512 M0 256 H512 M0 384 H512" />
    <path d="M128 0 V512 M256 0 V512 M384 0 V512" />
  </g>

  <!-- Rose ember -->
  <circle cx="256" cy="256" r="220" fill="url(#ember)"/>

  <!-- LUCID prompt glyph: rose chevron + cursor block, mono-feel -->
  <g transform="translate(256 256)">
    <text
      x="0" y="22"
      text-anchor="middle"
      font-family="ui-monospace, Menlo, monospace"
      font-size="160"
      font-weight="700"
      fill="#FF8AB4"
    >›</text>
    <rect x="38" y="-44" width="46" height="92" fill="#f6f4ff"/>
  </g>
</svg>
